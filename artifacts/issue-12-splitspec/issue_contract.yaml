case_id: issue-12
summary: The /events list endpoint returns a total count that reflects only the number
  of items in the current page instead of the total number of events in the database.
invariants:
- "For a GET request to /events, the response JSON must contain a field \"total\"\
  \ whose value equals the total number of event records that satisfy the request\u2019\
  s filter criteria, independent of the supplied limit and offset parameters."
inputs:
- GET /events with limit=2&offset=0 on a database containing 6 events
- GET /events with limit=100&offset=0 on the same database
- "GET /events with any limit/offset (including limit=0) on any non\u2011empty database"
expected_outputs:
- 'Response JSON includes "total": 6 for both requests above (the overall count of
  events), while the "items" array length respects the limit parameter (2 for the
  first request, 6 for the second).'
- When limit is larger than the total number of events, "total" still equals the full
  event count.
out_of_scope:
- The ordering of returned events
- The exact shape of the "items" array beyond containing event objects
- Pagination navigation links or other metadata not explicitly mentioned
- Behavior of "total" when additional query filters (e.g., date range) are applied
ambiguities:
- It is not specified whether the "total" should reflect counts after applying optional
  filter parameters other than limit/offset; the contract assumes it should count
  events matching any provided filters.
confidence: high
