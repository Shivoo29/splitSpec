case_id: issue-03
summary: "Events created with a non\u2011UTC timezone offset are stored or returned\
  \ with an incorrect conversion, causing the reported start time to be offset by\
  \ the original timezone difference."
invariants:
- "When an event is created with a start_time that includes a non\u2011zero timezone\
  \ offset, the system must store the corresponding UTC instant (i.e., start_time_UTC\
  \ = start_time_local minus the offset)."
- When an event is retrieved, the reported start_time must represent the same absolute
  instant as the value supplied at creation; for inputs with an offset this typically
  means the API returns the UTC equivalent of the original local time.
- When an event is created with a start_time already expressed in UTC, the stored
  and returned value must be unchanged.
inputs:
- "POST /events with a JSON body containing start_time = \"2023-01-01T10:00:00+02:00\"\
  \ (or any other non\u2011zero offset)."
- POST /events with a JSON body containing start_time = "2023-01-01T10:00:00Z" (UTC).
- GET /events/{id} for the events created above.
expected_outputs:
- GET for the +02:00 case returns start_time = "2023-01-01T08:00:00Z" (the UTC instant
  corresponding to the original 10:00+02:00).
- GET for the UTC case returns start_time = "2023-01-01T10:00:00Z".
- "The database record for the +02:00 case stores the UTC instant 2023\u201101\u2011\
  01T08:00:00Z."
out_of_scope:
- "Client\u2011side rendering or formatting of the date string."
- "Support for other date\u2011time fields unrelated to event start_time."
- Migration of existing data that may already be stored incorrectly.
ambiguities:
- Whether the API is required to return the start_time in UTC or preserve the original
  offset in the response.
- "Exact format of the date\u2011time string expected by the API (ISO\u20118601, epoch\
  \ milliseconds, etc.)."
- "How naive (timezone\u2011less) datetime inputs should be interpreted."
confidence: medium
