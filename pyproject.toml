[project]
name = "splitspec"
version = "0.1.0"
description = "Independent verification for AI-generated bug fixes"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
# schemas.TestRun is a pydantic model, not a test class
python_classes = ["Test*Case"]
asyncio_mode = "auto"
# The plain unit suite never touches Docker: docker-backed tests must be
# deselected by default and run explicitly with `pytest -m docker`.
markers = [
    "docker: requires a running Docker daemon and the splitspec-sandbox image",
]
addopts = "-m 'not docker'"

[tool.ruff]
line-length = 110
# `app` is the fixture's own package; listing its root keeps seeded bug files under
# fixtures/eventpulse/bugs/ from being linted as if `app` were third-party.
src = [".", "fixtures/eventpulse"]
target-version = "py311"
# Run artifacts are the recorded evidence behind every claim in the README, and the
# verifier tests inside them were written by a model. Linting them would report on
# the model's style, and `--fix` would silently rewrite the record.
extend-exclude = ["artifacts", "apps/dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

